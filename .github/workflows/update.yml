name: Update volume leaderboard

on:
  schedule:
    # Every 10 minutes. GitHub throttles scheduled workflows, so this cron
    # often runs hours apart rather than every 10 minutes. The open week's
    # leaderboard and volume split refresh in the browser; this job is the
    # snapshot other windows and finished weeks fall back to.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "fetch.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch leaderboard
        run: python fetch.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json data/weeks
          if git diff --staged --quiet; then
            echo "No changes in leaderboard snapshots"
          else
            git commit -m "chore: update 42 volume leaderboard snapshot"
            git push
          fi
